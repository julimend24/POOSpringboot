# ============================================================
#  CONFIGURACIÓN DE LA APLICACIÓN - Gestión Universitaria MVP
# ============================================================
server.port=8080
spring.application.name=gestion-universitaria

# ============================================================
#  DATASOURCE - MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/proyectopoo?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CLAVE: desactiva la conversión camelCase -> snake_case de Spring Boot.
# Sin esto, Hibernate 6 convierte "proyectoDeGradoTerminado" a
# "proyecto_de_grado_terminado" y rompe contra tu BD original.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================================
#  THYMELEAF
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.universidad=DEBUG
logging.level.org.hibernate.SQL=DEBUG
